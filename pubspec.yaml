name: math_farm
description: "Fermadagi Matematika — bolalar uchun quvnoq matematika o'yini."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.0
  flame: ^1.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# App ikonkasi — 1+2=3 brend belgi (dizayn: Matematika Oyini.dc.html).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/icon_full.png"
  min_sdk_android: 21
  # To'liq dizayn BACKGROUND qatlamda (MIUI foreground'ni zoom qilib buzmasin);
  # foreground shaffof.
  adaptive_icon_background: "assets/brand/icon_full.png"
  adaptive_icon_foreground: "assets/brand/icon_transparent.png"
  remove_alpha_ios: true

# OS-darajali qisqa splash — osmon fonda 1+2=3 belgi. So'ng ilova ichidagi
# to'liq SplashScene (quyosh/bulut/o't/panjara/Bilimdon) ko'rinadi.
flutter_native_splash:
  color: "#7FC6F5"
  image: assets/brand/splash_mark.png
  android_12:
    image: assets/brand/icon_foreground.png
    color: "#7FC6F5"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/content/
    - assets/audio/sfx/
    - assets/audio/music/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 700
